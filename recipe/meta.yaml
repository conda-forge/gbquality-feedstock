{% set name = "gbquality" %}
{% set version = "0.31" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 29097025e73f5cfcbdfad6d2bf67e8b7d7d1f7659a1bc0db065287dd3d6a7420

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - numba >=0.47.0
  run:
    - numpy
    - python >={{ python_min }}
    - scikit-learn
    - scipy
    - numba >=0.47.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - gbquality

about:
  home: https://github.com/AndLen/gbquality
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Python translation of the original MATLAB code for the GB measure.
  dev_url: https://github.com/AndLen/gbquality

extra:
  recipe-maintainers:
    - AndLen
